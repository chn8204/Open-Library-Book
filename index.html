<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f7fb">
    <title>Open Library Book Search</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="intro">
            <p class="eyebrow">DISCOVER YOUR NEXT READ</p>
            <h1>Open Library Book Search</h1>
            <p>
                Open Library provides public book catalog data. This page uses its
                Search API to look up books by title or author.
            </p>
            <p class="endpoint">
                <strong>API endpoint:</strong>
                <code>https://openlibrary.org/search.json</code>
            </p>
        </header>

        <section class="search-panel" aria-labelledby="search-heading">
            <h2 id="search-heading">Search the catalog</h2>
            <form id="search-form">
                <label for="search-input">Book title or author</label>
                <div class="search-controls">
                    <input id="search-input" name="query" type="search" value="The Hobbit"
                        placeholder="For example, The Hobbit" required>
                    <button id="search-button" type="submit">
                        <span>Search books</span>
                        <span class="button-arrow" aria-hidden="true">→</span>
                    </button>
                </div>
            </form>
        </section>

        <section class="results-section" aria-live="polite">
            <p id="status" role="status">Loading books from Open Library...</p>
            <div id="results" class="results-grid"></div>
        </section>
    </main>

    <script src="app.js" defer></script>
</body>
</html>
